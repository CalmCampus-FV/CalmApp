name: CalmCampus
# The real iOS app. Generate with `xcodegen generate` (the .xcodeproj is gitignored).

options:
  bundleIdPrefix: co.lumenworks.calmcampus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: H74552K78K   # Florian Braun (Personal Team); switch to the paid team when enrolled
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  CalmCampus:
    type: application
    platform: iOS
    sources:
      - CalmCampus
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: CalmCampus
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
    # Public v1 has no HealthKit: no entitlements file and no NSHealthShareUsageDescription.
    # The daily / HealthKit code lives in Legacy/ and is not part of this target.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.lumenworks.calmcampus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CalmCampusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CalmCampusTests
      # The old daily planner and its tests keep running here. Pure Foundation code only;
      # the daily UI, SwiftData model and HealthKit code stay out of every target.
      - path: Legacy/DailyTests
      - path: Legacy/Daily/Checkin
        excludes:
          - CheckinView.swift
      # Foundation-only value type used by the planner tests. Not HealthSignals.swift (HealthKit).
      - path: Legacy/Daily/Sensing/SleepSegment.swift
    dependencies:
      - target: CalmCampus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.lumenworks.calmcampus.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CalmCampus:
    build:
      targets:
        CalmCampus: all
        CalmCampusTests: [test]
    test:
      targets:
        - CalmCampusTests
